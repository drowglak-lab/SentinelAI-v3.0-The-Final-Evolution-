version: '3.8'

services:
  siem:
    build:
      context: .
      dockerfile: Dockerfile.siem
    ports:
      - "9000:9000"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/audit_siem.db
    restart: always

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    depends_on:
      - siem
    environment:
      - SIEM_URL=http://siem:9000
    restart: always
