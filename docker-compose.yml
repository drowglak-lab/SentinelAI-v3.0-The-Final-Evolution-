version: '3.8'

services:
  gateway:
    build: 
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - siem
      - opa

  siem:
    build:
      context: .
      dockerfile: Dockerfile.siem
    ports:
      - "9000:9000"
    volumes:
      - ./data:/app/data

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  opa:
    image: openpolicyagent/opa:latest-debug
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=debug"
      - "/policies"
    volumes:
      - ./config/opa:/policies  # Монтируем папку с нашим policy.rego
      
networks:
  default:
    name: sentinel_network
