[package]
name = "sentinel_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "sentinel_core"
crate-type = ["cdylib"]

[dependencies]
# Main bridge. Version 0.21+ and stable ABI for Python 3.14 support
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py312"] }

# Ultra-fast tables for our Store
dashmap = "5.5"

# Lock-free снимки памяти (Snapshot Reality)
arc-swap = "1.6"

# Working with the global state
lazy_static = "1.4"

# Serialization (JSON support)
serde = { version = "1.0", features = ["derive"] }
