[package]
name = "sentinel_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "sentinel_core"
crate-type = ["cdylib"]

[dependencies]
# Основной мост между Rust и Python 3.14
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py312"] }

# Быстрые таблицы для хранилища политик
dashmap = "5.5"

# Lock-free снимки памяти
arc-swap = "1.6"

# Глобальное состояние
lazy_static = "1.4"

# Сериализация данных (основной движок)
serde = { version = "1.0", features = ["derive"] }

# --- Добавленные зависимости для логгера ---

# Для записи событий в формате JSON
serde_json = "1.0"

# Для генерации точных меток времени (ISO-8601)
chrono = { version = "0.4", features = ["serde"] }
