[package]
name = "sentinel_core"
version = "0.1.0"
edition = "2021"

[lib]
# This is critical: we specify that this is a dynamic library for Python
name = "sentinel_core"
crate-type = ["cdylib"]

[dependencies]
# We update the version and add support for stable ABI
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py312"] }
dashmap = "5.5"
arc-swap = "1.6"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }

# Ultra-fast parallel hash tables (our Store)
dashmap = "5.5"

# Lock-free memory snapshots (Snapshot Reality)
arc-swap = "1.6"

# To work with the global state
lazy_static = "1.4"

# Serialization (if we want to save rules in JSON)
serde = { version = "1.0", features = ["derive"] }
