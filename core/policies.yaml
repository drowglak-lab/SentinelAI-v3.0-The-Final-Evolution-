version: "2.0"
policies:
  - id: "spanish_high_risk_block"
    tool: "transfer_funds"
    mode: "enforce"
    condition:
      and:
        - atom: { attr_key: "country", operator: "eq", value: "ES" }
        - or:
            - atom: { attr_key: "amount", operator: "gt", value: 50000 }
            - atom: { attr_key: "risk_score", operator: "gt", value: 0.9 }

  - id: "global_whitelist"
    tool: "transfer_funds"
    mode: "shadow"
    condition:
      atom: { attr_key: "user_tier", operator: "eq", value: "vip" }
