version: "1.5"
policies:
  - id: "large_transfer_block"
    tool: "transfer_funds"
    mode: "enforce"
    attr_key: "risk_score"
    operator: "gt"
    value: 0.8

  - id: "spain_geo_check"
    tool: "transfer_funds"
    mode: "shadow"
    attr_key: "country"
    operator: "eq"
    value: "ES"

  - id: "vip_limit_check"
    tool: "transfer_funds"
    mode: "shadow"
    attr_key: "amount"
    operator: "gt"
    value: 20000.0
