version: "1.2"
policies:
  - id: "large_transfer_block"
    tool: "transfer_funds"
    mode: "enforce"
    attr_key: "risk_score"
    operator: "gt"
    threshold: 0.8

  - id: "new_user_shadow_check"
    tool: "transfer_funds"
    mode: "shadow"
    attr_key: "risk_score"
    operator: "gt"
    threshold: 0.5

  - id: "vip_limit_check"
    tool: "transfer_funds"
    mode: "shadow"
    attr_key: "amount"
    operator: "gt"
    threshold: 10000.0
