# policies.yaml
version: "1.0"
policies:
  - id: "large_transfer_block"
    tool: "transfer_funds"
    mode: "enforce"
    condition: { field: "risk_score", operator: "gt", value: 0.8 }
  
  - id: "new_user_shadow_check"
    tool: "transfer_funds"
    mode: "shadow"
    condition: { field: "risk_score", operator: "gt", value: 0.5 }
