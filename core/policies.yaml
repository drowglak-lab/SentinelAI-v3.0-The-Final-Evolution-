version: "2.0"
policies:
  - id: "spanish_high_risk_block"
    tool: "transfer_funds"
    mode: "enforce"
    condition:
      and:
        - atom: { attr_key: "country", operator: "eq", value: "ES" }
        - or:
            - atom: { attr_key: "amount", operator: "gt", value: 20000 }
            - atom: { attr_key: "risk_score", operator: "gt", value: 0.8 }

  - id: "eu_whitelist"
    tool: "transfer_funds"
    mode: "shadow"
    condition:
      atom: { attr_key: "country", operator: "in", value: ["IT", "FR", "DE"] }
