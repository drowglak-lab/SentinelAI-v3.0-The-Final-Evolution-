version: "1.3"
policies:
  - id: "large_transfer_block"
    tool: "transfer_funds"
    mode: "enforce"
    attr_key: "risk_score"
    operator: "gt"
    threshold: 0.8

  - id: "spain_geo_check" # 🇪🇸 Новое строковое правило
    tool: "transfer_funds"
    mode: "shadow"
    attr_key: "country"
    operator: "eq"
    threshold: 0.0
    target_val: "ES"

  - id: "vip_limit_check"
    tool: "transfer_funds"
    mode: "shadow"
    attr_key: "amount"
    operator: "gt"
    threshold: 10000.0
